{% extands "base.html" %}

{% block title %}내 정보 수정 - My Hotdeal{% endblock %}

{% block content %}
<h4 class="mb-4"><i class="fas fa-user-edit"></i> 내 정보 수정</h4>
<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('my_hotdeal.profile') }}">
      {{ form.hidden_tag() }}
      <div class="mb-3">
        <label class="form-label">아이디</label>
        <input type="text" class="form-control" value="{{ current_user.id }}" readonly>
      </div>
      <div class="mb-3">
        <label class="form-label">이름</label>
        {{ form.name(class="form-control") }}
      </div>
      <div class="mb-3">
        <label class="form-label">이메일</label>
        {{ form.email(class="form-control") }}
      </div>
      <div class="mb-3">
        <label class="form-label">전화번호</label>
        {{ form.phone(class="form-control") }}
      </div>
      <button type="submit" class="btn btn-primary">수정하기</button>
    </form>
  </div>
</div>
{% endblock %}
